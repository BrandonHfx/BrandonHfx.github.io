# Save this file as .github/workflows/ratings.yml in your repo
name: ratings-to-discord
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python post_ratings.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      - run: |
          git config user.name "ratings-bot"
          git config user.email "ratings-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "update seen state" && git push)
